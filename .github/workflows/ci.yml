name: CI

on:
    push:
        branches: [main]
    pull_request:

permissions:
    contents: read

jobs:
    test:
        name: Test and upload results
        runs-on: ubuntu-latest

        steps:
            - name: Check out repository
              uses: actions/checkout@v4

            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm

            - name: Install dependencies
              run: npm ci

            - name: Run test suite
              run: npm test -- --reporter=default --reporter=junit --outputFile=reports/junit.xml

            - name: Upload JUnit report to ReproPulse
              if: always() && vars.REPROPULSE_ENDPOINT != ''
              uses: ./actions/upload-junit
              with:
                endpoint: ${{ vars.REPROPULSE_ENDPOINT }}
                ingestion-token: ${{ secrets.REPROPULSE_INGESTION_TOKEN }}
                report-path: reports/junit.xml
                workflow-run-id: ${{ github.run_id }}