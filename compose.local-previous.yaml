services:
  postgres:
    image: postgres:16-alpine
    container_name: reprpulse-postgres
    environment:
      POSTGRES_USER: repropulse
      POSTGRES_PASSWORD: repropulse_dev_password
      POSTGRES_DB: repropulse
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: repropulse-redis
    ports:
      - "6379:6379"

volumes:
  postgres-data:
