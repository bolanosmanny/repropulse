services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: repropulse
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-repropulse_dev_password}
      POSTGRES_DB: repropulse
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U repropulse -d repropulse"]
      interval: 5s
      timeout: 5s
      retries: 10
  
  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
    command: sh -c "npm run db:migrate && npm run start"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: postgresql://repropulse:${POSTGRES_PASSWORD:-repropulse_dev_password}@postgres:5432/repropulse
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "3001:3001"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://localhost:3001/health').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))\"",
        ] 
      interval: 10s
      timeout: 5s
      retries: 10

  webhook-worker:
    build:
      context: .
    command: npm run worker:webhooks:prod
    env_file:
      - .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://repropulse:${POSTGRES_PASSWORD:-repropulse_dev_password}@postgres:5432/repropulse
      REDIS_URL: redis://redis:6379
    depends_on:
      api:
        condition: service_healthy

  test-report-worker:
    build:
      context: .
    command: npm run worker:test-reports:prod
    env_file:
      - .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://repropulse:${POSTGRES_PASSWORD:-repropulse_dev_password}@postgres:5432/repropulse
      REDIS_URL: redis://redis:6379
    depends_on:
      api:
        condition: service_healthy

  dashboard:
    build:
      context: ./apps/dashboard
    environment:
      NODE_ENV: production
      REPROPULSE_API_URL: http://api:3001
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "3002:3000"

volumes:
  postgres_data:
  redis_data:




